packages:
  - "apps/*"
  - "packages/*"
  - "packages/fixtures/*"
  - "packages/fixtures/*/workspace"
  - "services/*"

allowBuilds:
  '@astryxdesign/core': true
  esbuild: true
  node-pty: true

catalog:
  "@fastify/static": ^10.1.3
  "@fastify/websocket": ^11.3.0
  "@openai/codex-sdk": 0.150.1
  "@sinclair/typebox": ^0.34.41
  "@types/node": ^24.3.0
  fastify: ^5.12.1
  node-pty: 1.1.0
  turbo: ^2.10.12
  typescript: ^5.9.2
  vitest: ^3.2.4

minimumReleaseAgeExclude:
  - '@openai/codex-sdk@0.150.1'
  - '@openai/codex@0.150.1-darwin-arm64 || 0.150.1-darwin-x64 || 0.150.1-linux-arm64 || 0.150.1-linux-x64 || 0.150.1-win32-arm64 || 0.150.1-win32-x64 || 0.150.1'
